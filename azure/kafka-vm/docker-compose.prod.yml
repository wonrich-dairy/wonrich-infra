# Wonrich production Kafka broker, on the same Azure VM as staging (SCRUM-126).
# Copied to the VM at ~/kafka/docker-compose.prod.yml by `ENV=prod azure/kafka-vm/deploy.sh`.
#
# A second, independent broker, so a staging test can never put events into production:
#   - its own compose project, containers, data volume and Docker network
#   - its own cluster ID and SASL credentials, from ~/kafka/.env.prod (never committed)
#   - its client listener on 9095 (staging is 9094)
# Topic names are the same as staging (same kafka/topics.env), so only the bootstrap address and
# password differ between environments and no service code changes.
#
# Listeners:
#   INTERNAL (9092, PLAINTEXT)      - only inside this project's network, used by kafka-init
#   EXTERNAL (9095, SASL_PLAINTEXT) - reached over the internet by the production App Services
name: wonrich-kafka-prod

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: wonrich-kafka-prod
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9095:9095"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_PUBLIC_HOST:?KAFKA_PUBLIC_HOST missing from .env.prod}:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT

      # SASL/PLAIN on the external listener only, with production's own credentials.
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_EXTERNAL_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}" user_${KAFKA_USERNAME}="${KAFKA_PASSWORD}";

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Generated once by deploy.sh into .env.prod; must differ from the staging broker's.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID missing from .env.prod}
      # The VM also runs the staging broker and the observability stack; cap the heap.
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Creates the Wonrich topics from the same topics.env as staging, then exits.
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: wonrich-kafka-prod-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka:/infra:ro
    entrypoint: ["/bin/bash", "/infra/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      # Production keeps dead letters for the design value, 30 days (staging keeps 7).
      DLQ_RETENTION_MS: "2592000000"
    restart: "no"

volumes:
  kafka-data:
