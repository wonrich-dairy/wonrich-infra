name: wonrich-infra

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: wonrich-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      # Only the external listener is published. Anything inside the compose network talks to
      # kafka:9092 instead, which is why the two listeners advertise different host names.
      - "${KAFKA_HOST_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # A client connects once to learn the broker's advertised address, then reconnects to it.
      # A container resolves "kafka"; the host does not. So the published listener must advertise
      # localhost, or every produce call fails immediately after a successful metadata fetch.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # One broker has nowhere to replicate to, so every replication factor must be 1. The staging
      # broker on the Azure VM (azure/kafka-vm) is a single broker too.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created deliberately by kafka-init, not conjured into being by a typo in a
      # topic name on the producer side.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-wonrich-local-cluster-0001}
    volumes:
      # This named volume is what makes topic configuration survive a container restart and a
      # machine reboot. `docker compose down -v` is the deliberate way to start clean.
      - wonrich-kafka-data:/var/lib/kafka/data
    healthcheck:
      # Listing topics proves the broker is accepting client connections, not merely that the
      # process is alive - depends_on would otherwise release while the API is still closed.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [wonrich-net]

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: wonrich-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka:/infra:ro
    entrypoint: ["/bin/bash", "/infra/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    restart: "no"
    networks: [wonrich-net]

  # Optional: web UI to browse topics, messages and consumer groups (useful for demos)
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: wonrich-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: wonrich-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks: [wonrich-net]

volumes:
  wonrich-kafka-data:

networks:
  wonrich-net:
    name: wonrich-net